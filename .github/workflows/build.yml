name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun test
      - run: bun export
      - run: bunx publint --strict
      # scoped package: the tarball is named jwoglom-rmapi-js-<version>.tgz
      - name: Pack and check types
        run: |
          tarball=$(npm pack --ignore-scripts --silent)
          bunx @arethetypeswrong/cli --profile esm-only "$tarball"
